<!DOCTYPE html>
<html lang="{{brand.language}}" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{page.title}} — {{brand.name}} Brand System</title>
  <meta name="description" content="{{brand.description}}">

  <!-- Fonts: loaded from brand-config typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family={{brand.typography.heading}}:wght@{{brand.typography.heading_weights}}&family={{brand.typography.body}}:wght@{{brand.typography.body_weights}}&family={{brand.typography.mono}}:wght@{{brand.typography.mono_weights}}&display=swap" rel="stylesheet">

  <style>
    /* ══════════════════════════════════════════════
       DESIGN TOKENS — Generated from brand-config.yaml
       Replace {{...}} placeholders with actual values
       ══════════════════════════════════════════════ */

    :root {
      /* Colors */
      --primary: {{brand.colors.primary}};
      --primary-light: {{brand.colors.primary_light}};
      --primary-dark: {{brand.colors.primary_dark}};
      --secondary: {{brand.colors.secondary}};
      --cream: {{brand.colors.cream}};
      --accent: {{brand.colors.accent}};

      /* Neutrals */
      --n950: {{brand.colors.neutrals.n950}};
      --n900: {{brand.colors.neutrals.n900}};
      --n800: {{brand.colors.neutrals.n800}};
      --n700: {{brand.colors.neutrals.n700}};
      --n600: {{brand.colors.neutrals.n600}};
      --n500: {{brand.colors.neutrals.n500}};
      --n400: {{brand.colors.neutrals.n400}};
      --n300: {{brand.colors.neutrals.n300}};
      --n200: {{brand.colors.neutrals.n200}};
      --n100: {{brand.colors.neutrals.n100}};
      --n50: {{brand.colors.neutrals.n50}};

      /* Semantic */
      --success: {{brand.colors.semantic.success}};
      --warning: {{brand.colors.semantic.warning}};
      --error: {{brand.colors.semantic.error}};
      --info: {{brand.colors.semantic.info}};

      /* Typography */
      --font-heading: '{{brand.typography.heading}}', system-ui, sans-serif;
      --font-body: '{{brand.typography.body}}', system-ui, sans-serif;
      --font-mono: '{{brand.typography.mono}}', monospace;

      /* Spacing (4px base) */
      --space-0: 0;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;
      --space-20: 5rem;
      --space-24: 6rem;

      /* Radius */
      --radius-sm: 0.25rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-full: 9999px;

      /* Shadows */
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.2);
      --shadow-sm: 0 2px 4px rgba(0,0,0,0.2);
      --shadow-md: 0 4px 8px rgba(0,0,0,0.2);
      --shadow-lg: 0 8px 16px rgba(0,0,0,0.2);
      --shadow-xl: 0 16px 32px rgba(0,0,0,0.2);

      /* Motion */
      --duration-fast: 150ms;
      --duration-normal: 300ms;
      --duration-slow: 500ms;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);

      /* Layout */
      --container-max: 1200px;
      --nav-height: 64px;
    }

    /* ── Dark theme (default) ── */
    [data-theme="dark"] {
      --bg: var(--n950);
      --bg-alt: var(--n900);
      --text: var(--n50);
      --text-muted: var(--n400);
      --border: var(--n800);
    }

    /* ── Light/cream theme ── */
    [data-theme="light"] {
      --bg: var(--cream);
      --bg-alt: var(--n50);
      --text: var(--n900);
      --text-muted: var(--n600);
      --border: var(--n200);
    }

    /* ══════════════════════════════════════════════
       BASE STYLES
       ══════════════════════════════════════════════ */

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: var(--nav-height);
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-heading);
      font-weight: 700;
      line-height: 1.2;
    }

    h1 { font-size: clamp(2rem, 5vw, 3.5rem); }
    h2 { font-size: clamp(1.5rem, 3vw, 2.5rem); }
    h3 { font-size: clamp(1.25rem, 2.5vw, 1.75rem); }

    code, pre {
      font-family: var(--font-mono);
    }

    a {
      color: var(--primary);
      text-decoration: none;
      transition: color var(--duration-fast) var(--ease-out);
    }

    a:hover {
      color: var(--primary-light);
    }

    img {
      max-width: 100%;
      height: auto;
    }

    /* ══════════════════════════════════════════════
       NAVIGATION
       ══════════════════════════════════════════════ */

    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: var(--n950);
      border-bottom: 1px solid var(--n800);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-6);
      z-index: 1000;
      backdrop-filter: blur(12px);
    }

    .nav-logo {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
    }

    .nav-logo .logo-accent {
      color: var(--primary);
    }

    .nav-links {
      display: flex;
      gap: var(--space-4);
      list-style: none;
    }

    .nav-links a {
      color: var(--n400);
      font-size: 0.875rem;
      font-weight: 500;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      transition: all var(--duration-fast) var(--ease-out);
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text);
      background: var(--n800);
    }

    .nav-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* ══════════════════════════════════════════════
       MAIN CONTENT
       ══════════════════════════════════════════════ */

    main {
      margin-top: var(--nav-height);
    }

    .section {
      padding: var(--space-16) var(--space-6);
    }

    .section--dark {
      background: var(--n950);
      color: var(--n50);
    }

    .section--cream {
      background: var(--cream);
      color: var(--n900);
    }

    .section--alt {
      background: var(--n900);
    }

    .container {
      max-width: var(--container-max);
      margin: 0 auto;
    }

    .section-header {
      margin-bottom: var(--space-10);
    }

    .section-header h2 {
      margin-bottom: var(--space-3);
    }

    .section-header p {
      color: var(--text-muted);
      font-size: 1.125rem;
      max-width: 600px;
    }

    /* ══════════════════════════════════════════════
       FOOTER
       ══════════════════════════════════════════════ */

    .footer {
      background: var(--n950);
      border-top: 1px solid var(--n800);
      padding: var(--space-8) var(--space-6);
      text-align: center;
    }

    .footer-logo {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: var(--space-2);
    }

    .footer-logo .logo-accent {
      color: var(--primary);
    }

    .footer p {
      color: var(--n500);
      font-size: 0.875rem;
    }

    /* ══════════════════════════════════════════════
       RESPONSIVE
       ══════════════════════════════════════════════ */

    @media (max-width: 768px) {
      .nav-links {
        display: none;
        position: absolute;
        top: var(--nav-height);
        left: 0;
        right: 0;
        flex-direction: column;
        background: var(--n950);
        border-bottom: 1px solid var(--n800);
        padding: var(--space-4);
      }

      .nav-links.open {
        display: flex;
      }

      .nav-toggle {
        display: block;
      }

      .section {
        padding: var(--space-10) var(--space-4);
      }
    }
  </style>
</head>
<body>

  <!-- ═══ NAVIGATION ═══ -->
  <nav class="nav">
    <a href="index.html" class="nav-logo">
      <!-- Logo: customize per brand-config.logo -->
      <span>{{brand.logo.primary}}</span>
    </a>

    <ul class="nav-links">
      <!-- Generated from brand.pages where nav: true -->
      {{#each brand.pages}}
      {{#if nav}}
      <li><a href="{{id}}.html" {{#if active}}class="active"{{/if}}>{{title}}</a></li>
      {{/if}}
      {{/each}}
    </ul>

    <button class="nav-toggle" aria-label="Toggle menu">&#9776;</button>
  </nav>

  <!-- ═══ MAIN CONTENT ═══ -->
  <main>
    <!-- Hero Section -->
    <section class="section section--dark">
      <div class="container">
        <div class="section-header">
          <h1>{{page.title}}</h1>
          <p>{{page.description}}</p>
        </div>

        <!-- Page-specific content goes here -->

      </div>
    </section>

    <!-- Additional sections: alternate between section--dark and section--cream -->

  </main>

  <!-- ═══ FOOTER ═══ -->
  <footer class="footer">
    <div class="footer-logo">
      <span>{{brand.logo.primary}}</span>
    </div>
    <p>&copy; {{brand.year}} {{brand.full_name}}. Brand System v{{brand.version}}</p>
  </footer>

  <!-- ═══ SCRIPTS ═══ -->
  <script>
    // Mobile menu toggle
    const navToggle = document.querySelector('.nav-toggle');
    const navLinks = document.querySelector('.nav-links');
    if (navToggle) {
      navToggle.addEventListener('click', () => {
        navLinks.classList.toggle('open');
      });
    }

    // Active page highlight
    const currentPage = location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.nav-links a').forEach(link => {
      if (link.getAttribute('href') === currentPage) {
        link.classList.add('active');
      }
    });
  </script>

</body>
</html>
