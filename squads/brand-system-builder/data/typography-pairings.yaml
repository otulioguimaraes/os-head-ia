scale_recommendations:
  major_third:
    ratio: 1.25
    sizes: [12, 14, 16, 20, 25, 31, 39, 49]
    best_for: "Compact, information-dense layouts"
  perfect_fourth:
    ratio: 1.333
    sizes: [12, 14, 16, 21, 28, 38, 50, 67]
    best_for: "General purpose, balanced hierarchy"
  augmented_fourth:
    ratio: 1.414
    sizes: [12, 14, 16, 23, 32, 45, 64, 90]
    best_for: "Bold, impactful layouts"
  golden_ratio:
    ratio: 1.618
    sizes: [12, 14, 16, 26, 42, 68, 110]
    best_for: "Maximum impact, editorial layouts"
